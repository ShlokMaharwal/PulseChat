name: PulseChat checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        run: node tools/check-links.mjs
      - name: Generate isolated test secrets
        run: |
          node tools/init-env.mjs
          node -e "const fs=require('fs');const line=fs.readFileSync('.env','utf8').split(/\r?\n/).find(v=>v.startsWith('JWT_SECRET='));fs.appendFileSync(process.env.GITHUB_ENV,line+'\n')"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend lint, types, unit tests, and build
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build
      - name: Build and start the replicated stack
        run: |
          docker compose --parallel 1 build gateway-1 processor-1 integration
          docker compose --parallel 1 up -d --wait --wait-timeout 600
      - name: Functional smoke and integration tests
        run: |
          docker compose run --rm --no-deps smoke
          docker compose --profile test run --rm --no-deps integration
      - name: Verify all six failure scenarios
        # The default and optional authenticated databases are separate projects.
        working-directory: backend
        run: npm run test:chaos
      - name: Verify optional database authentication
        run: node tools/prove-database-auth.mjs
      - name: Real browser chat and recovery tests
        working-directory: frontend
        env:
          TEST_HTTP_URL: http://127.0.0.1:8080
          COMPOSE_FILE: docker-compose.yml
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Save service logs
        if: always()
        run: |
          mkdir -p backend/.cache
          docker compose logs --no-color > backend/.cache/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: |
            backend/.cache/compose.log
            backend/.cache/chaos/*.json
            backend/.cache/secure-proof-result.json
            backend/.cache/e2e-results.json
            backend/.cache/playwright/
      - name: Stop test services
        if: always()
        run: docker compose down
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint, types, unit tests, and build
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build
  kafka-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Prepare HA verification
        run: |
          node tools/init-env.mjs
          cd backend
          npm ci
          npm run build
      - name: Build and start three Kafka brokers
        run: |
          docker compose --parallel 1 build gateway-1 processor-1 frontend
          docker compose -f docker-compose.yml -f docker-compose.ha.yml --profile ha --parallel 1 up -d --wait --wait-timeout 600 frontend kafka kafka-2 kafka-3 redis mongo gateway-1 gateway-2 gateway-3 processor-1 processor-2 nginx
      - name: Kill the active partition leader and verify recovery
        working-directory: backend
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ha.yml
          COMPOSE_PROFILES: ha
          KAFKA_BROKERS: localhost:19092,localhost:19093,localhost:19094
          KAFKA_REPLICATION_FACTOR: "3"
          DEPENDENCY_TIMEOUT_MS: "10000"
        run: npx tsx chaos/run.ts kafka
      - name: Save HA logs
        if: always()
        run: |
          mkdir -p backend/.cache
          docker compose -f docker-compose.yml -f docker-compose.ha.yml --profile ha logs --no-color > backend/.cache/ha-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kafka-ha-verification
          path: |
            backend/.cache/chaos/kafka.json
            backend/.cache/ha-compose.log
      - name: Stop HA services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ha.yml --profile ha down
