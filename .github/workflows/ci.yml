name: PulseChat checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        run: node tools/check-links.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend lint, types, unit tests, and build
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build
      - name: Build and start the replicated stack
        run: |
          docker compose --parallel 1 build gateway-1 processor-1 integration
          docker compose --parallel 1 up -d --wait --wait-timeout 600
      - name: Functional smoke and integration tests
        run: |
          docker compose run --rm --no-deps smoke
          docker compose --profile test run --rm --no-deps integration
      - name: Verify all four failure scenarios
        working-directory: backend
        run: npm run test:chaos
      - name: Save service logs
        if: always()
        run: |
          mkdir -p backend/.cache
          docker compose logs --no-color > backend/.cache/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: |
            backend/.cache/compose.log
            backend/.cache/chaos/*.json
      - name: Stop test services
        if: always()
        run: docker compose down
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint, types, unit tests, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build
