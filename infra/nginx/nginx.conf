worker_processes auto;
events { worker_connections 4096; }

http {
    map "$scheme:$http_x_forwarded_proto" $hsts {
        default "";
        ~^https: "max-age=31536000";
        "http:https" "max-age=31536000";
    }
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream gateways {
        zone gateways 64k;
        least_conn;
        server gateway-1:8080 resolve;
        server gateway-2:8080 resolve;
        server gateway-3:8080 resolve;
        keepalive 32;
    }
    server {
        listen 80;
        server_tokens off;
        client_max_body_size 20k;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security $hsts always;
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"alive","service":"nginx"}';
        }
        location = /readyz {
            proxy_pass http://gateways/readyz;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
        location /api/ {
            proxy_pass http://gateways/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
        location = /ws {
            proxy_pass http://gateways;
            proxy_connect_timeout 3s;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering off;
        }
        location / {
            set $frontend http://frontend:80;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
