global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: pulsechat-gateways
    static_configs:
      - targets: ['gateway-1:8080', 'gateway-2:8080', 'gateway-3:8080']
  - job_name: pulsechat-processors
    static_configs:
      - targets: ['processor-1:8080', 'processor-2:8080']
